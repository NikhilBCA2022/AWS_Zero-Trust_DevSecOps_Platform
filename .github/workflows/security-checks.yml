
name: Application Security Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python Tests and Security Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud-ops-dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-ops-dashboard-api/requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run Bandit security scan
        run: bandit -r app -ll

      - name: Audit Python dependencies
        run: pip-audit -r requirements-dev.txt

  container-security:
    name: Docker Build and Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag cloud-ops-dashboard-api:${{ github.sha }} \
            ./cloud-ops-dashboard-api

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: cloud-ops-dashboard-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Excludes pip's embedded SBOM (bom.cdx.json) which ships inside the
          # pip/_vendor directory and reports five HIGH findings unrelated to
          # our application dependencies. This exclusion does NOT mean the
          # application dependencies are vulnerability-free.
          skip-files: '**/pip/_vendor/bom.cdx.json'
