name: Application Security Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python tests and security checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-ops-dashboard-api
    env:
      API_KEYS: test-api-key-for-ci-123456789
      ENABLE_DOCS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-ops-dashboard-api/requirements.txt

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install security tools
        run: pip install bandit pip-audit pytest

      - name: Run application tests
        run: python -m pytest tests -q

      - name: Run Bandit static security analysis
        run: bandit -r app -ll

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  container-security:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t cloud-ops-dashboard-api:${{ github.sha }} ./cloud-ops-dashboard-api

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloud-ops-dashboard-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
