name: Zero-Trust CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-trust-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------
  # 1. Secret Scanning
  # --------------------------------------------------
  secret_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2

  # --------------------------------------------------
  # 2. Python Tests and Security
  # --------------------------------------------------
  python_security:
    name: Python Tests and Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud-ops-dashboard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-ops-dashboard-api/requirements-dev.txt

      - name: Install development dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pip-audit

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run Bandit
        run: bandit -r app -ll

      - name: Audit dependencies
        run: pip-audit -r requirements-dev.txt

  # --------------------------------------------------
  # 3. Terraform Validation
  # --------------------------------------------------
  terraform_validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  # --------------------------------------------------
  # 4. Build and Scan Docker Image
  # --------------------------------------------------
  build_and_scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    needs:
      - secret_scan
      - python_security
      - terraform_validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          set -euo pipefail

          docker build \
            --tag "cloud-ops-dashboard-api:${GITHUB_SHA}" \
            ./cloud-ops-dashboard-api

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: cloud-ops-dashboard-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: '**/pip/_vendor/bom.cdx.json'

      - name: Save the scanned image
        run: |
          set -euo pipefail

          docker save \
            --output cloud-ops-dashboard-api.tar \
            "cloud-ops-dashboard-api:${GITHUB_SHA}"

      - name: Upload scanned image
        uses: actions/upload-artifact@v4
        with:
          name: scanned-application-image
          path: cloud-ops-dashboard-api.tar
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------
  # 5. Publish Scanned Image to Amazon ECR
  # --------------------------------------------------
  publish_image:
    name: Publish Approved Image to ECR
    runs-on: [self-hosted, linux, x64, zero-trust-deploy]

    needs:
      - secret_scan
      - python_security
      - terraform_validation
      - build_and_scan

    if: >-
      ${{
        success() &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        )
      }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: scanned-application-image
          path: image-artifact

      - name: Load scanned image
        run: |
          set -euo pipefail

          docker load \
            --input image-artifact/cloud-ops-dashboard-api.tar

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and publish the scanned image
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$ECR_REPOSITORY_URL"
          test -n "$IMAGE_TAG"

          docker tag \
            "cloud-ops-dashboard-api:${IMAGE_TAG}" \
            "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"

          docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"

  # --------------------------------------------------
  # 6. Deploy to Amazon EKS
  # --------------------------------------------------
  deploy_to_eks:
    name: Deploy to Private EKS
    runs-on: [self-hosted, linux, x64, zero-trust-deploy]

    needs:
      - publish_image

    if: >-
      ${{
        success() &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        )
      }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.0"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure EKS access
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail

          test -n "$EKS_CLUSTER_NAME"

          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name "$EKS_CLUSTER_NAME"

      - name: Deploy Kubernetes manifests with verified image
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}
          K8S_MANIFEST_PATH: ${{ vars.K8S_MANIFEST_PATH }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        run: |
          set -euo pipefail

          test -n "$ECR_REPOSITORY_URL"
          test -n "$IMAGE_TAG"
          test -n "$K8S_MANIFEST_PATH"
          test -n "$K8S_NAMESPACE"
          test -d "$K8S_MANIFEST_PATH"

          rendered_manifest="$(mktemp)"
          trap 'rm -f "$rendered_manifest"' EXIT

          kubectl kustomize "$K8S_MANIFEST_PATH" > "$rendered_manifest"

          python3 - "$rendered_manifest" "$ECR_REPOSITORY_URL" "$IMAGE_TAG" <<'PY'
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          repository = sys.argv[2]
          image_tag = sys.argv[3]

          manifest = manifest_path.read_text()
          old_image = f"{repository}:latest"
          new_image = f"{repository}:{image_tag}"

          if old_image not in manifest:
              raise SystemExit(
                  f"Expected image {old_image} was not found in rendered manifests."
              )

          manifest = manifest.replace(old_image, new_image)
          manifest_path.write_text(manifest)

          if new_image not in manifest:
              raise SystemExit("SHA-tagged image was not found after replacement.")

          print(f"Deployment image pinned to: {new_image}")
          PY

          kubectl apply \
            --filename "$rendered_manifest" \
            --namespace "$K8S_NAMESPACE"

      - name: Verify deployment rollout
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          K8S_DEPLOYMENT_NAME: ${{ vars.K8S_DEPLOYMENT_NAME }}
        run: |
          set -euo pipefail

          test -n "$K8S_NAMESPACE"
          test -n "$K8S_DEPLOYMENT_NAME"

          kubectl rollout status \
            "deployment/${K8S_DEPLOYMENT_NAME}" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=300s

          kubectl get deployments,pods,services \
            --namespace "$K8S_NAMESPACE"
