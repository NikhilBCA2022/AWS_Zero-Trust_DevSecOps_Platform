apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-ops-api
  namespace: cloud-ops
  labels:
    app.kubernetes.io/name: cloud-ops-dashboard-api
    app.kubernetes.io/part-of: aws-zero-trust-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-ops-api
  template:
    metadata:
      labels:
        app: cloud-ops-api
        app.kubernetes.io/name: cloud-ops-dashboard-api
    spec:
      serviceAccountName: cloud-ops-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloud-ops-api
          image: REPLACE_WITH_ECR_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: ENABLE_DOCS
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
