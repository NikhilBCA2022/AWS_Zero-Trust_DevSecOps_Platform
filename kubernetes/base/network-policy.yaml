apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-ops-api-restrictive
  namespace: cloud-ops
spec:
  podSelector:
    matchLabels:
      app: cloud-ops-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud-ops
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.20.21.0/24
        - ipBlock:
            cidr: 10.20.22.0/24
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 10.20.11.0/24
        - ipBlock:
            cidr: 10.20.12.0/24
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-ops-api-allow-alb
  namespace: cloud-ops
spec:
  podSelector:
    matchLabels:
      app: cloud-ops-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.20.1.0/24
        - ipBlock:
            cidr: 10.20.2.0/24
      ports:
        - protocol: TCP
          port: 8000
---
